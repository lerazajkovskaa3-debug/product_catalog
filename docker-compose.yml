services:
  db:
    image: postgres:16-alpine
    environment:
     POSTGRES_DB: catalog
     POSTGRES_USER: catalog_user
     POSTGRES_PASSWORD: catalog_password
    volumes:
     - postgres_data:/var/lib/postgresql/data
     - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog"]
     interval: 5s
     timeout: 5s
     retries: 10

  backend:
    build: ./backend
    ports:
     - "3000:3000"
    environment:
     DB_HOST: db
     DB_PORT: 5432
     DB_NAME: catalog
     DB_USER: catalog_user
     DB_PASSWORD: catalog_password
    depends_on:
     db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: